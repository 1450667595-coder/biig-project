version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: biiig-postgres
    environment:
      POSTGRES_USER: biiig
      POSTGRES_PASSWORD: biiig
      POSTGRES_DB: biiig
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: biiig-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
